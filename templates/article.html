<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{title}} · Manuel Fernández</title>
<meta name="description" content="{{summary}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{summary}}">
<meta property="og:url" content="{{canonical}}">
<meta property="article:published_time" content="{{date_iso}}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d1d1f'/%3E%3Ctext x='32' y='42' font-family='-apple-system,Helvetica,Arial' font-size='28' font-weight='600' text-anchor='middle' fill='%23f5f5f7'%3EMF%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme: light dark;
  --bg:     light-dark(#ffffff, #000000);
  --bg-alt: light-dark(#f5f5f7, #101012);
  --ink:    light-dark(#1d1d1f, #f5f5f7);
  --soft:   light-dark(#6e6e73, #a1a1a6);
  --line:   light-dark(#d2d2d7, #38383a);
  --blue:   light-dark(#0066cc, #2997ff);
  --code:   light-dark(#f5f5f7, #1c1c1e);
  --nav:    light-dark(rgb(255 255 255 / .72), rgb(22 22 23 / .72));
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
  --display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:19px/1.6 var(--font);letter-spacing:-.012em;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
.nav{position:sticky;top:0;z-index:10;background:var(--nav);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.nav .in{max-width:980px;margin:0 auto;padding:0 22px;height:48px;display:flex;align-items:center;justify-content:space-between;font-size:12px}
.nav .brand{font-weight:600;font-size:15px;color:var(--ink)}
.nav a.back{color:var(--ink);opacity:.85}
article{max-width:692px;margin:0 auto;padding:clamp(48px,4rem + 2vw,96px) 22px 40px}
.meta{font-size:15px;font-weight:600;color:var(--soft)}
h1{font-family:var(--display);font-size:clamp(2.2rem,1.5rem + 3vw,3.6rem);line-height:1.07;letter-spacing:-.015em;font-weight:700;margin:.35rem 0 .9rem;text-wrap:balance}
.lede{font-size:clamp(1.2rem,1.05rem + .5vw,1.45rem);line-height:1.4;color:var(--soft);font-weight:500;margin:0 0 2.4rem;text-wrap:pretty}
.body h2{font-family:var(--display);font-size:1.6rem;line-height:1.2;margin:2.4rem 0 .8rem;text-wrap:balance}
.body h3{font-family:var(--display);font-size:1.25rem;margin:2rem 0 .6rem}
.body p,.body ul,.body ol,.body blockquote{margin:0 0 1.2rem;text-wrap:pretty}
.body li{margin-bottom:.4rem}
.body blockquote{border-left:3px solid var(--line);padding-left:1rem;color:var(--soft)}
.body code{font:.85em ui-monospace,"SF Mono",Menlo,monospace;background:var(--code);padding:.1em .35em;border-radius:6px}
.body pre{background:var(--code);padding:1rem;border-radius:12px;overflow-x:auto;font-size:15px;line-height:1.5}
.body pre code{background:none;padding:0}
.body img{max-width:100%;height:auto;border-radius:12px}
.sources{margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--line);font-size:15px;color:var(--soft)}
.sources h2{font-size:15px;font-weight:600;margin:0 0 .5rem;font-family:var(--font);color:var(--ink)}
.sources ul{margin:0;padding-left:1.1rem}
.sources li{overflow-wrap:anywhere}
.discuss{margin-top:2rem;font-size:17px}
.more::after{content:" ›"}
footer{background:var(--bg-alt);color:var(--soft);font-size:12px;padding:22px;margin-top:40px}
footer .in{max-width:980px;margin:0 auto}
</style>
</head>
<body>
<header class="nav">
  <nav class="in" aria-label="Principal">
    <a class="brand" href="../../">Manuel Fernández</a>
    <a class="back" href="../../#publicaciones">Publicaciones</a>
  </nav>
</header>
<main>
  <article>
    <p class="meta"><time datetime="{{date_iso}}">{{date_human}}</time> · {{reading_time}} min de lectura</p>
    <h1>{{title}}</h1>
    <p class="lede">{{summary}}</p>
    <div class="body">
{{body}}
    </div>
{{sources}}
{{discuss}}
  </article>
</main>
<footer><div class="in">© {{year}} Manuel Fernández. Las opiniones son mías, no de mi empleador.</div></footer>
</body>
</html>
